  # Фьючерсы MOEX FORTS: конкретные сезонные контракты ("быстрый вариант").
  # Проверены запросами к ISS 2026-10-08 — все отдают свечи через стандартный
  # эндпоинт /iss/engines/futures/markets/forts/securities/{secid}/candles.json.
  # ВНИМАНИЕ: тикеры сезонные (буква = месяц, цифра = год). При ролловере
  # (за ~2 недели до экспирации) список нужно обновить на следующую серию.
  # Автоматическая замена на переходящие контракты с резолвингом и склейкой
  # непрерывных рядов — см. BACKLOG.md (пункт B-1).
  futures:
    # --- Валюты и ставки ---
    - SiZ6        # доллар/рубль, декабрь 2026 (ключевой актив)
    - CRZ6        # юань/рубль расчётный, декабрь 2026 (лидер оборота FORTS)
    - UCZ6        # юань CNH/RUB (UCNY), декабрь 2026
    - EDZ6        # евро/рубль расчётный (ED), декабрь 2026
    - UMZ6        # доллар/рубль (USDM), декабрь 2026
    - USDRUBF     # доллар/рубль срочный (TOFX, бессрочный)
    - EURRUBF     # евро/рубль срочный (TOFX, бессрочный)
    - CNYRUBF     # юань/рубль срочный (TOFX, бессрочный)
    - SRZ6        # ставка RUONIA (SBRF), декабрь 2026
    - KKZ6        # ключевая ставка ЦБ РФ (KEYRATE), декабрь 2026
    # --- Индексы ---
    - MXZ6        # индекс Мосбиржи (MIX), декабрь 2026
    - MMZ6        # индекс Мосбиржи (MXI), декабрь 2026
    - RIZ6        # индекс РТС (RTS), декабрь 2026
    - RBZ6        # индекс RGBI (ОФЗ), декабрь 2026
    - RGBIF       # фьючерс на индекс RGBI (бессрочный TOFX)
    - IMOEXF      # фьючерс на индекс Мосбиржи (бессрочный TOFX)
    - SFZ6        # S&P 500 (SPYF), декабрь 2026
    - NAZ6        # Nasdaq-100 (NASD), декабрь 2026
    - DJZ6        # Dow Jones 30 (DJ30), декабрь 2026
