  # эндпоинт /iss/engines/futures/markets/forts/securities/{secid}/candles.json.
  # ВНИМАНИЕ: тикеры сезонные (буква = месяц, цифра = год). При ролловере
  # (за ~2 недели до экспирации) список нужно обновить на следующую серию.
  # Автоматическая замена на переходящие контракты с резолвингом и склейкой
  # непрерывных рядов — см. BACKLOG.md (пункт B-1).
