  # Фьючерсы: переходящие (непрерывные) контракты MOEX FORTS.
  # Тикеры вида "XXX1!" — это синтетические серии, которые MOEX сама склеивает
  # по мере экспирации ближайшего контракта: менять список при ролловере не нужно.
  # ВНИМАНИЕ: обычный эндпоинт /iss/.../candles.json для тикеров "!" возвращает
  # пустой ответ — загрузку нужно вести через историю OHLC
  # (/iss/history/engines/futures/markets/forts/securities/{secid}/daily.json),
  # либо loader должен резолвить "BR1!" в текущий серийный контракт (BRZ6 и т.п.).
  futures:
    - CNYRUBF1!  # юань/рубль расчётный (CNY-серия, CRZ6)
    - BRENT1!    # нефть Brent (BR-серия, BRX6/BRZ6)
    - MXI1!      # индекс Мосбиржи (MIX/MXI-серии, MXZ6/MMZ6)
    - GOLD1!     # золото (GOLD-серия, GDZ6)
    - NG1!       # природный газ (NG-серия, NGV6/NGX6)
    - SILV1!     # серебро (SILV-серия, SVZ6)
    - COCOA1!    # какао (COCOA-серия, CCX6)
    - RTS1!      # индекс РТС (RTS-серия, RIZ6)
    - MMI1!      # индекс ММВБ 10 (MMI-серия, MAZ6)
    - UCNY1!     # юань CNH/RUB (UCNY-серия, UCZ6)
    - EURRUBF1!  # евро/рубль расчётный (ED-серия, EDZ6)
    - RUONIA1!   # ставка RUONIA (SBRF-серия, SRZ6)
    - GLDRUB1!   # золото в рублях (GL-серия, GLZ6)
    - NASD1!     # Nasdaq-100 (NASD-серия, NAZ6)
    - Si1!       # доллар/рубль (Si-серия, SiZ6) — вне топ-15, ключевой актив

  indices:
    - IMOEX
    - RGBI
